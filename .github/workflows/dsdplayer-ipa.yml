name: DSDPlayer IPA

on:
  push:
    branches:
      - claude/dsd-music-player-app-ywOc8
    paths:
      - "DSDPlayer/**"
      - ".github/workflows/dsdplayer-ipa.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA (for SideStore / AltStore)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build everything and dump logs
        id: build
        continue-on-error: true
        shell: bash
        working-directory: DSDPlayer
        run: |
          set +e
          exec > >(tee -a run.log) 2>&1

          echo "::group::env"
          uname -a
          sw_vers
          sudo xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks | head -50
          echo "::endgroup::"

          echo "::group::install xcodegen"
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
          echo "::endgroup::"

          echo "::group::xcodegen generate"
          xcodegen generate
          XCG_RC=$?
          echo "xcodegen rc=$XCG_RC"
          ls -la
          if [ "$XCG_RC" != "0" ]; then
            echo "::error::xcodegen failed"
            exit "$XCG_RC"
          fi
          echo "::endgroup::"

          echo "::group::project filesystem"
          ls -la DSDPlayer.xcodeproj/ 2>&1 || echo "(no xcodeproj dir)"
          file DSDPlayer.xcodeproj/project.pbxproj 2>&1 || true
          wc -l DSDPlayer.xcodeproj/project.pbxproj 2>&1 || true
          echo "--- first 80 lines of project.pbxproj ---"
          head -80 DSDPlayer.xcodeproj/project.pbxproj 2>&1 || echo "(no project.pbxproj)"
          echo "::endgroup::"

          echo "::group::project listing"
          xcodebuild -list -project ./DSDPlayer.xcodeproj 2>&1 || echo "(xcodebuild -list failed but continuing)"
          echo "::endgroup::"

          echo "::group::xcodegen version + plist plugin"
          xcodegen --version
          plutil -lint Info.plist 2>&1 || echo "(plutil failed on Info.plist)"
          echo "::endgroup::"

          echo "::group::Info.plist (generated)"
          if [ -f Info.plist ]; then
            cat Info.plist
          else
            echo "(no Info.plist at DSDPlayer/Info.plist)"
            find . -name Info.plist -not -path "*/build/*" -not -path "*/DerivedData/*" -not -path "*/.git/*"
          fi
          echo "::endgroup::"

          echo "::group::xcodebuild build"
          xcodebuild \
            -project DSDPlayer.xcodeproj \
            -scheme DSDPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            clean build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO
          XCB_RC=$?
          echo "xcodebuild rc=$XCB_RC"
          echo "::endgroup::"

          echo "::group::built products tree"
          find build/Build/Products -maxdepth 4 -type d 2>/dev/null || true
          echo "::endgroup::"

          if [ "$XCB_RC" != "0" ]; then
            exit "$XCB_RC"
          fi

          echo "::group::package .ipa"
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 2 -name '*.app' -type d | head -n1)
          echo "APP_PATH=$APP_PATH"
          test -n "$APP_PATH"
          rm -rf Payload DSDPlayer.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          codesign --remove-signature "Payload/$(basename "$APP_PATH")" 2>/dev/null || true
          find "Payload/$(basename "$APP_PATH")" -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
          find "Payload/$(basename "$APP_PATH")" -name "embedded.mobileprovision" -delete 2>/dev/null || true
          zip -qry DSDPlayer.ipa Payload
          ls -lh DSDPlayer.ipa
          echo "::endgroup::"

      - name: Upload diagnostic bundle (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            DSDPlayer/run.log
            DSDPlayer/DSDPlayer.xcodeproj/project.pbxproj
            DSDPlayer/Info.plist
          if-no-files-found: warn

      - name: Upload IPA artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: DSDPlayer-IPA
          path: DSDPlayer/DSDPlayer.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Dump run.log via annotations + step summary
        if: always()
        shell: bash
        working-directory: DSDPlayer
        run: |
          if [ ! -f run.log ]; then
            echo "::warning::no run.log produced"
            exit 0
          fi

          # Annotations are visible on the public run page even without
          # a GitHub login, so use them as the primary failure signal.
          # macOS ships bash 3.2, so avoid mapfile and stick to a portable
          # while-read loop.
          grep -nE "(error:|fatal|BUILD FAILED|Undefined symbol|Command .* failed|xcodegen rc=|xcodebuild rc=|first 80 lines|wc -l|file DSD)" run.log \
            | head -n 50 \
            | while IFS= read -r line; do
                esc=$(printf '%s' "$line" | sed -e 's/%/%25/g')
                echo "::error::${esc}"
              done

          # Also surface the first lines of project.pbxproj as notices
          # so we can see what xcodegen actually wrote.
          awk '/first 80 lines of project.pbxproj/{p=1; next} /^::endgroup::|^---/{p=0} p' run.log \
            | head -n 20 \
            | while IFS= read -r line; do
                esc=$(printf '%s' "$line" | sed -e 's/%/%25/g')
                echo "::notice::pbxproj: ${esc}"
              done

          # Also dump full log to step summary (visible to logged-in users).
          {
            echo "## DSDPlayer build log (outcome: ${{ steps.build.outcome }})"
            echo ""
            echo '```'
            tail -n 400 run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mark job failed if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Build step failed - see job summary or run.log artifact"
          exit 1
