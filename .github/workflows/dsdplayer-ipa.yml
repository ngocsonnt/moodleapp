name: DSDPlayer IPA

on:
  push:
    branches:
      - claude/dsd-music-player-app-ywOc8
    paths:
      - "DSDPlayer/**"
      - ".github/workflows/dsdplayer-ipa.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA (for SideStore / AltStore)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: DSDPlayer
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Pin Xcode (latest stable available on runner)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Diagnostics
        run: |
          set -x
          uname -a
          sw_vers
          sudo xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks
          which xcodegen || true

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: |
          set -x
          xcodegen generate
          ls -la
          test -d DSDPlayer.xcodeproj || { echo "::error::xcodegen did not produce DSDPlayer.xcodeproj"; exit 1; }
          xcodebuild -list -project DSDPlayer.xcodeproj
          test -f Resources/Info.plist || ls Resources

      - name: Build (no code signing)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project DSDPlayer.xcodeproj \
            -scheme DSDPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            clean build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee xcodebuild.log

      - name: Upload xcodebuild log (always)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: |
            DSDPlayer/xcodebuild.log
            DSDPlayer/DSDPlayer.xcodeproj/project.pbxproj
            DSDPlayer/Resources/Info.plist
          if-no-files-found: warn

      - name: Surface build errors from log
        if: steps.build.outcome == 'failure'
        run: |
          echo "::group::Last 200 lines"
          tail -n 200 xcodebuild.log || true
          echo "::endgroup::"
          echo "::group::error/warning lines"
          grep -E "(error:|warning:|note:|BUILD FAILED|Code Sign error)" xcodebuild.log | head -n 100 || true
          echo "::endgroup::"
          exit 1

      - name: Package .ipa
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 2 -name '*.app' -type d | head -n1)
          if [ -z "${APP_PATH}" ]; then
            echo "::error::No .app bundle produced by xcodebuild"
            find build/Build/Products -maxdepth 3 -type d
            exit 1
          fi
          echo "Found app at: ${APP_PATH}"

          rm -rf Payload DSDPlayer.ipa
          mkdir Payload
          cp -R "${APP_PATH}" Payload/

          # SideStore re-signs on install, so we ship completely unsigned.
          codesign --remove-signature "Payload/$(basename "${APP_PATH}")" 2>/dev/null || true
          find "Payload/$(basename "${APP_PATH}")" -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
          find "Payload/$(basename "${APP_PATH}")" -name "embedded.mobileprovision" -delete 2>/dev/null || true

          zip -qry DSDPlayer.ipa Payload
          ls -lh DSDPlayer.ipa

      - name: Upload IPA artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: DSDPlayer-IPA
          path: DSDPlayer/DSDPlayer.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        if: steps.build.outcome == 'success'
        run: |
          {
            echo "## DSDPlayer.ipa ready"
            echo ""
            echo "**Download:** scroll to the bottom of this run page, under *Artifacts*."
            echo ""
            echo "**Install on iPhone with SideStore:**"
            echo "1. Open the artifact zip on iPhone (Safari -> share -> Save to Files)."
            echo "2. Unzip in the Files app, then long-press the .ipa -> Share -> SideStore."
            echo "3. SideStore signs with your free Apple ID and installs. Re-open SideStore every 7 days to refresh."
          } >> "$GITHUB_STEP_SUMMARY"
