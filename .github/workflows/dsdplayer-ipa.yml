name: DSDPlayer IPA

on:
  push:
    branches:
      - claude/dsd-music-player-app-ywOc8
    paths:
      - "DSDPlayer/**"
      - ".github/workflows/dsdplayer-ipa.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA (for SideStore / AltStore)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build everything and dump logs
        id: build
        continue-on-error: true
        shell: bash
        working-directory: DSDPlayer
        run: |
          set +e
          exec > >(tee -a run.log) 2>&1

          echo "::group::env"
          uname -a
          sw_vers
          sudo xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks | head -50
          echo "::endgroup::"

          echo "::group::install xcodegen"
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
          echo "::endgroup::"

          echo "::group::xcodegen generate"
          xcodegen generate
          XCG_RC=$?
          echo "xcodegen rc=$XCG_RC"
          ls -la
          if [ "$XCG_RC" != "0" ]; then
            echo "::error::xcodegen failed"
            exit "$XCG_RC"
          fi
          echo "::endgroup::"

          echo "::group::project listing"
          xcodebuild -list -project DSDPlayer.xcodeproj || echo "(xcodebuild -list failed but continuing)"
          echo "::endgroup::"

          echo "::group::Info.plist (generated)"
          if [ -f Info.plist ]; then
            cat Info.plist
          else
            echo "(no Info.plist at DSDPlayer/Info.plist)"
            find . -name Info.plist -not -path "*/build/*" -not -path "*/DerivedData/*" -not -path "*/.git/*"
          fi
          echo "::endgroup::"

          echo "::group::xcodebuild build"
          xcodebuild \
            -project DSDPlayer.xcodeproj \
            -scheme DSDPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            clean build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO
          XCB_RC=$?
          echo "xcodebuild rc=$XCB_RC"
          echo "::endgroup::"

          echo "::group::built products tree"
          find build/Build/Products -maxdepth 4 -type d 2>/dev/null || true
          echo "::endgroup::"

          if [ "$XCB_RC" != "0" ]; then
            exit "$XCB_RC"
          fi

          echo "::group::package .ipa"
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 2 -name '*.app' -type d | head -n1)
          echo "APP_PATH=$APP_PATH"
          test -n "$APP_PATH"
          rm -rf Payload DSDPlayer.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          codesign --remove-signature "Payload/$(basename "$APP_PATH")" 2>/dev/null || true
          find "Payload/$(basename "$APP_PATH")" -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
          find "Payload/$(basename "$APP_PATH")" -name "embedded.mobileprovision" -delete 2>/dev/null || true
          zip -qry DSDPlayer.ipa Payload
          ls -lh DSDPlayer.ipa
          echo "::endgroup::"

      - name: Upload diagnostic bundle (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            DSDPlayer/run.log
            DSDPlayer/DSDPlayer.xcodeproj/project.pbxproj
            DSDPlayer/Info.plist
          if-no-files-found: warn

      - name: Upload IPA artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: DSDPlayer-IPA
          path: DSDPlayer/DSDPlayer.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Dump run.log to step summary
        if: always()
        shell: bash
        working-directory: DSDPlayer
        run: |
          {
            echo "## DSDPlayer build log (outcome: ${{ steps.build.outcome }})"
            echo ""
            echo '<details><summary>Last 400 lines of run.log</summary>'
            echo ""
            echo '```'
            tail -n 400 run.log 2>/dev/null || echo "(no run.log)"
            echo '```'
            echo ""
            echo '</details>'
            echo ""
            if [ -f run.log ]; then
              echo "### Errors / warnings"
              echo ""
              echo '```'
              grep -E "(error:|warning:|BUILD FAILED|fatal|Undefined symbol)" run.log | head -n 80 || echo "(no error lines matched)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mark job failed if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Build step failed - see job summary or run.log artifact"
          exit 1
